name: groovin.io pages deployment
run-name: groovin.io pages deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger groovin.io page sync
        env:
          GROOVIN_IO_PAGE_API_TOKEN: ${{ secrets.GROOVIN_IO_PAGE_API_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${GROOVIN_IO_PAGE_API_TOKEN}" \
            "https://groovin.io/api/sync"
